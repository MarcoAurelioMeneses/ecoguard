rules:
  - id: ecoguard-no-eval
    languages: [python]
    severity: ERROR
    message: Do not evaluate dynamic code.
    pattern: eval(...)
  - id: ecoguard-no-dangerously-set-html
    languages: [javascript, typescript]
    severity: ERROR
    message: Do not inject raw HTML. Model and publisher text must be rendered as text.
    pattern-regex: dangerouslySetInnerHTML
    paths:
      include:
        - frontend/features
