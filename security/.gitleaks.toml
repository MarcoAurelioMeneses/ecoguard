title = "EcoGuard"

[extend]
useDefault = true

[allowlist]
description = "Local compose database password. It is not a production secret."
regexTarget = "line"
regexes = [
  '''ecoguard:ecoguard''',
  '''POSTGRES_PASSWORD: ecoguard''',
  '''PASSWORD ''ecoguard_agent''',
  '''ECOGUARD_AGENT_DB_PASSWORD:ecoguard_agent''',
]
