services:
  postgres:
    build:
      context: ./postgres
    environment:
      POSTGRES_USER: ecoguard
      POSTGRES_PASSWORD: ecoguard
      POSTGRES_DB: ecoguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoguard -d ecoguard"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
