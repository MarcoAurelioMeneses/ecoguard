# Owned by infra/. GitHub Actions only loads workflows from .github/workflows.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test and static analysis
        run: ./backend/gradlew -p backend check --no-daemon
      - name: Cache OWASP NVD data
        uses: actions/cache@v6
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-nvd-${{ runner.os }}
      - name: OWASP Dependency-Check
        timeout-minutes: 12
        continue-on-error: true
        run: ./backend/gradlew -p backend dependencyCheckAnalyze --no-daemon
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Design sync
        run: ./scripts/check-design-sync.sh
      - name: Lint
        run: pnpm lint
      - name: Frontend contract test
        run: pnpm --filter @ecoguard/web test
      - name: Typecheck
        run: pnpm typecheck
      - name: Build placeholder
        run: pnpm --filter @ecoguard/web build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: security/.gitleaks.toml
      - name: Semgrep
        run: pip install semgrep && semgrep scan --config security/semgrep.yml --error --metrics=off
      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: security/trivy.yaml
