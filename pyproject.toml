[project]
name = "ecoguard"
version = "0.1.0"
description = "EcoGuard city risk intelligence for São Paulo — workspace root"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend"]

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src", "backend/tests"]
extend-exclude = ["design"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/src", "backend/tests"]
mypy_path = "backend/src"
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
markers = [
  "integration: requires a migrated Postgres (ECOGUARD_DATABASE_URL)",
]
