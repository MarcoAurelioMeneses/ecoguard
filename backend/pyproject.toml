[project]
name = "ecoguard-backend"
version = "0.1.0"
description = "EcoGuard API, workers, and analyst boundary"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "uvicorn>=0.32",
]

[project.scripts]
ecoguard-workers = "ecoguard.interfaces.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecoguard"]
