server:
  port: ${SERVER_PORT:8000}

spring:
  application:
    name: ecoguard-api
  datasource:
    url: ${ECOGUARD_JDBC_URL:jdbc:postgresql://localhost:5432/ecoguard}
    username: ${ECOGUARD_DB_USER:ecoguard}
    password: ${ECOGUARD_DB_PASSWORD:ecoguard}
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    openai:
      # Lets the process start with no key. The analyst bean stays off until OPENAI_API_KEY is set.
      api-key: ${OPENAI_API_KEY:local-not-configured}
      chat:
        options:
          model: gpt-4o-mini
springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /docs
management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
ecoguard:
  environment: ${ECOGUARD_ENVIRONMENT:local}
  web-origin: ${ECOGUARD_WEB_ORIGIN:http://localhost:3000,http://127.0.0.1:3000}
  openai:
    api-key: ${OPENAI_API_KEY:}
  rate-limit:
    requests: 120
