server:
  port: ${SERVER_PORT:8000}

spring:
  application:
    name: ecoguard-api
  datasource:
    url: ${ECOGUARD_JDBC_URL:jdbc:postgresql://localhost:5432/ecoguard}
    username: ${ECOGUARD_DB_USER:ecoguard}
    password: ${ECOGUARD_DB_PASSWORD:ecoguard}
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    openai:
      # Lets the process start with no key. The analyst bean stays off until OPENAI_API_KEY is set.
      api-key: ${OPENAI_API_KEY:local-not-configured}
      chat:
        options:
          # Chat Completions function calling on gpt-6-luna requires reasoning_effort=none.
          # temperature is accepted at that effort (Spring AI default 0.7) and rejected otherwise.
          model: ${ecoguard.analyst.model}
          reasoning-effort: ${ecoguard.analyst.reasoning-effort}
springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /docs
management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
ecoguard:
  environment: ${ECOGUARD_ENVIRONMENT:local}
  web-origin: ${ECOGUARD_WEB_ORIGIN:http://localhost:3000,http://127.0.0.1:3000}
  openai:
    api-key: ${OPENAI_API_KEY:}
  analyst:
    model: ${ECOGUARD_ANALYST_MODEL:gpt-6-luna}
    reasoning-effort: ${ECOGUARD_ANALYST_REASONING_EFFORT:none}
    # USD per 1M tokens. Standard short-context row for gpt-6-luna.
    # https://developers.openai.com/api/docs/pricing
    pricing:
      "[gpt-6-luna]":
        input: 0.10
        cached-input: 0.01
        output: 0.50
  rate-limit:
    requests: 120
